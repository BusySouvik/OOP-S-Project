<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account | VCART</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/customer-site.css">
<script src="/js/security.js" defer></script>
<script src="/js/app.js" defer></script>
</head>
<body class="auth-page">
<header class="navbar">
<a href="/" class="brand">V<span>CART</span><small>.</small></a>
<a href="/" class="login-link">Back to store ↗</a>
</header>
<main class="auth-shell">
<section class="auth-art">
<span class="eyebrow">A NEW WAY TO SHOP</span>
<h1>Make yourself<br><span>at home.</span></h1>
<p>Create your VCART account and bring everything you love into one place.</p>
<div class="auth-monogram">V.</div>
</section>
<section class="auth-panel">
<span class="eyebrow">JOIN THE VCART COMMUNITY</span>
<h2>Create account.</h2>
<p class="muted">A few details and you're ready to go.</p>
<form id="register-form" class="auth-form">
<label>Full name<input name="fullName" placeholder="Your full name" required></label>
<label>Email address<input type="email" name="email" placeholder="you@example.com" required></label>
<label>Phone number<input name="phone" placeholder="Optional"></label>
<label>Password<input type="password" name="password" minlength="8" placeholder="At least 8 characters" required></label>
<button class="primary-button full-button" type="submit">Create my account ↗</button>
<p id="form-message" class="form-message"></p>
</form>
<p class="auth-switch">Already have an account? <a href="/customer/login">Sign in</a></p>
</section>
</main>
</body>
</html>
